<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caacupe+One&family=Changa+One:ital@0;1&family=Fjalla+One&family=Lilita+One&family=Luckiest+Guy&family=Roboto:ital,wght@0,100..900;1,100..900&family=Titan+One&display=swap" rel="stylesheet">
    <title>Gamer Studio</title>
</head>
<style>
    body{
        background-color: black;
    }
    *{
        margin:0px;
        padding:0px;
    }
    #app_bar{
        position:sticky;
        top:0;
        z-index:10;
        box-sizing:border-box;
        background-color:#080908;
        border-bottom:1px solid gray;
        height:51px;  
        display:flex;
        flex-direction: row;
        justify-content: space-between;
    }
    #two-icons{
        display:flex;
        flex-direction: row;
        padding-right: 20px;
        gap:20px;
    }
    #bells{
        display:block;
        height:30px;
        width:30px;
    }
    #notification-menu{
        position:relative;
        display:grid;
        place-items:center;
    }
    #notification-bell{
        position:relative;
        display:grid;
        place-items:center;
        width:40px;
        height:40px;
        padding:0;
        border:0;
        border-radius:50%;
        background:transparent;
        color:white;
        cursor:pointer;
    }
    #notification-bell:hover,
    #notification-bell[aria-expanded="true"]{
        background:#25262b;
    }
    #notification-bell:focus-visible,
    .notification-panel button:focus-visible{
        outline:2px solid #9ab8ff;
        outline-offset:2px;
    }
    #notification-count{
        position:absolute;
        top:0;
        right:0;
        display:grid;
        place-items:center;
        min-width:17px;
        height:17px;
        padding:0 3px;
        border:2px solid #080908;
        border-radius:20px;
        background:#e23b50;
        color:white;
        font-size:10px;
        line-height:1;
        box-sizing:border-box;
    }
    #notification-count[hidden]{
        display:none;
    }
    .notification-panel{
        position:absolute;
        top:calc(100% + 8px);
        right:0;
        z-index:30;
        display:flex;
        flex-direction:column;
        width:min(360px, calc(100vw - 24px));
        max-height:min(70vh, 500px);
        overflow:hidden;
        border:1px solid #343640;
        border-radius:14px;
        background:#15161a;
        color:#f3f2e9;
        box-shadow:0 16px 40px rgba(0,0,0,.55);
    }
    .notification-panel[hidden]{
        display:none;
    }
    .notification-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:14px 16px;
        border-bottom:1px solid #2b2c33;
    }
    .notification-header h2{
        font-size:18px;
    }
    .notification-header button{
        padding:6px 8px;
        border:0;
        border-radius:7px;
        background:transparent;
        color:#a9bcff;
        font-size:12px;
        cursor:pointer;
    }
    .notification-header button:disabled{
        opacity:.5;
        cursor:default;
    }
    #notification-status{
        padding:16px;
        color:#b7b9c3;
        font-size:13px;
    }
    #notification-status[hidden]{
        display:none;
    }
    #notification-list{
        overflow-y:auto;
    }
    .notification-item{
        display:flex;
        align-items:flex-start;
        gap:11px;
        width:100%;
        padding:13px 16px;
        border:0;
        border-bottom:1px solid #25262b;
        background:transparent;
        color:inherit;
        text-align:left;
        cursor:pointer;
    }
    .notification-item:hover{
        background:#202127;
    }
    .notification-item.unread{
        background:#1b1e2b;
    }
    .notification-dot{
        width:8px;
        height:8px;
        flex:none;
        margin-top:6px;
        border-radius:50%;
        background:#728cff;
    }
    .notification-item:not(.unread) .notification-dot{
        visibility:hidden;
    }
    .notification-copy{
        display:flex;
        flex:1;
        flex-direction:column;
        gap:5px;
        min-width:0;
        overflow-wrap:anywhere;
        font-size:13px;
        line-height:1.4;
    }
    .notification-time{
        color:#9a9ca7;
        font-size:11px;
    }
    #circle1{
        position:relative;
        display:grid;
        place-items:center;
        overflow:hidden;
        margin-top:5px;
        border:1px solid black;
        border-radius: 50px;
        width:40px;
        height:40px;
        background-color:navy;
        transition: 1s;
    }
    #circle1:active{
        transform: scale(0.95);
    }
    #header222{
    color: white;
text-align: center;
font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
  margin-top: 3px;
}
    .lines{
        display:flex;
        flex-direction:row;
        align-items:center;
        justify-content:flex-start;
        gap:10px;
        border-bottom:1px solid gray;
        height:50px;
        padding-left:10px;
    }
    svg{
        height:24px;
        width:24px;
        color:white;
    }
    #box{
        position:fixed;
        top:51px;
        left:0;
        background-color: black;
        border:1px solid gray;
        height:calc(100vh - 51px);
        width:20%;
        box-sizing:border-box;
        display:flex;
        flex-direction:column;
    }
    #news-container{
        display:block;
        box-sizing:border-box;
        margin-left:20%;
        min-height:calc(100vh - 51px);
        padding:28px;
        color:white;
        overflow:hidden;
    }
    #news-view{
        min-width:0;
        overflow-x:clip;
    }
    #header1{
  color:white;
  font-weight: 400;
  font-style: normal;
  font-family: "Changa One", sans-serif;
  font-weight: 400;
  padding-top:10px;
  padding-left: 10px;
    }
    .menu-label{
        color:white;
  font-weight: 400;
  font-style: normal;
  font-family: "Changa One", sans-serif;
  font-weight: 400;
  font-size:20px;
    }
    #profile{
        display:flex;
        flex-direction:row;
        align-items:center;
        gap:10px;
        margin-top:auto;
        margin-left:10px;
        margin-bottom:24px;
    }
    #circle{
        border:1px solid navy;
        height:50px;
        width:50px;
        border-radius:50px;
        display:flex;
        justify-content:center;
        align-items:center;
        background-color:navy;
        flex-shrink:0;
        overflow:hidden;
    }
    #circle img,
    #circle1 img{
        display:block;
        width:100%;
        height:100%;
        object-fit:cover;
        border-radius:50%;
    }
    #circle1 img{
        position:absolute;
        inset:0;
    }
    #circle img[hidden],
    #circle1 img[hidden]{
        display:none;
    }
    #user_name{
        color:white;
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: center;
        margin:0;
        font-size:30px;
    }
    #full_name{
        color:white;
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: left;
        margin:0;
        font-size:16px;
        min-width:0;
        flex:1;
        overflow-wrap:anywhere;
    }
    .lines.active{
        background-color: navy;
    }
    .lines.active svg,
    .lines.active .menu-label{
        color:white;
    }
    #news-heading{
        margin-bottom:18px;
        color:#f3f2e9;
        font-family:"Changa One", sans-serif;
        font-size:26px;
        font-weight:400;
    }
    .image{
        display:block;
        width:100%;
        height:clamp(240px, 56vh, 620px);
        object-fit:contain;
        background-color:#090a08;
        border-radius:4px;
    }
    .slide{
        box-sizing:border-box;
        flex:0 0 100%;
        min-width:0;
        width:100%;
        display:flex;
        flex-direction:column;
        gap:14px;
        padding:16px;
        border:1px solid #36382f;
        border-radius:8px;
        background-color:#151612;
    }
    .game_content,.game_description{
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: left;
        color:white;
    }
    .game_content{
        font-size:22px;
    }
    .game_description{
        color:#b7b9ae;
        font-size:14px;
    }
    #slider-track{
        display:flex;
        flex-direction:row;
        min-width:0;
        width:100%;
        gap:20px;
        transition:transform 0.5s ease;
        touch-action:pan-y;
    }
    #slider-track .slide{
        flex:0 0 100%;
        min-width:0;
        width:100%;
    }
    #slider-controls{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:14px;
        margin-top:16px;
    }
    .slider-arrow{
        display:grid;
        place-items:center;
        width:36px;
        height:36px;
        border:1px solid #45483c;
        border-radius:50%;
        background-color:#171914;
        color:#f3f2e9;
        cursor:pointer;
    }
    .slider-arrow:hover{
        border-color:white;
        color:white;
    }
    .slider-arrow svg{
        width:18px;
        height:18px;
    }
    #slider-indicators{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
    }
    .slider-indicator{
        width:8px;
        height:8px;
        padding:0;
        border:0;
        border-radius:8px;
        background-color:#686b60;
        cursor:pointer;
    }
    .slider-indicator[aria-current="true"]{
        width:22px;
        background-color:white;
    }
    #recent{
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        text-align: left;
        color:white;
    }
    #more-games-heading{
        margin-top:28px;
        margin-bottom:16px;
        color:#f3f2e9;
        font-family:"Changa One", sans-serif;
        font-size:22px;
        font-weight:400;
    }
    #remaining-games{
        display:grid;
        grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
        gap:16px;
    }
    .remaining-game{
        min-width:0;
        overflow:hidden;
        border:1px solid #36382f;
        border-radius:8px;
        background-color:#151612;
    }
    .remaining-game img{
        display:block;
        width:100%;
        aspect-ratio:16 / 9;
        object-fit:contain;
        background-color:#090a08;
    }
    .remaining-game h3,
    .remaining-game p{
        margin:12px;
        color:#f3f2e9;
        font-family:"Archivo Black", sans-serif;
    }
    .remaining-game p{
        margin-top:-4px;
        color:#b7b9ae;
        font-size:13px;
    }
    #container1{
        display:flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap:4px;
        width:max-content;
        max-width:100%;
        padding:4px;
        border:1px solid #36382f;
        background-color:#11120f;
        border-radius:12px;
        margin-bottom:20px;
    }
    #button,
    #button1{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:40px;
        padding:0 18px;
        border:1px solid transparent;
        border-radius:9px;
        text-align: center;
        transition:background-color 160ms ease, color 160ms ease, border-color 160ms ease;
    }
    #button{
        border-color:navy;
        background-color:navy;
        color:white;
    }
    #button1{
        background-color:transparent;
        color:#b7b9ae;
    }
    #button1:hover{
        border-color:#45483c;
        background-color:#1b1d17;
        color:#f3f2e9;
    }
    #text,
    #text1{
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
        font-size:13px;
        line-height:1;
        white-space:nowrap;
    }
    .lines.logout-line svg,
    .lines.logout-line .menu-label{
        color:red;
    }
    #add-button{
        display:grid;
        place-items:center;
        height:60px;
        width:60px;
        padding:0;
        position:fixed;
        bottom:24px;
        right:24px;
        border:4px solid white;
        border-radius:50%;
        background:navy;
        box-shadow:0 5px 0 #050b24, 0 8px 14px rgba(0, 0, 0, 0.45);
        cursor:pointer;
        transition:transform 150ms ease, box-shadow 150ms ease;
    }
    #add-button:hover{
        transform:translateY(-2px);
        box-shadow:0 7px 0 #050b24, 0 10px 16px rgba(0, 0, 0, 0.45);
    }
    #add-button:active{
        transform:translateY(3px);
        box-shadow:0 2px 0 #050b24;
    }
    #add-button svg{
        display:block;
        flex:none;
        width:34px;
        height:34px;
        margin:0;
        fill:none;
        stroke:white;
        stroke-width:3;
        stroke-linecap:round;
        pointer-events:none;
    }
    .post-modal-overlay{
        position:fixed;
        inset:0;
        z-index:20;
        display:grid;
        place-items:center;
        padding:20px;
        box-sizing:border-box;
        background-color:rgba(0, 0, 0, 0.35);
        -webkit-backdrop-filter:blur(6px);
        backdrop-filter:blur(6px);
    }
    .div2{
        position:relative;
        display:flex;
        flex-direction:column;
        align-items:stretch;
        gap:16px;
        margin:0;
        border: 1px solid #2d2d3a;
        border-radius: 12px;
        min-height:380px;
        width:min(90%, 720px);
        box-sizing:border-box;
        padding:20px;
        background:#17181d;
        color:white;
        animation:pop 160ms ease-out;
    }
@keyframes pop{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}
    .composer-title{
        padding-right:44px;
        font-size:20px;
    }
    .composer-close{
        position:absolute;
        top:14px;
        right:14px;
        display:grid;

        width:36px;
        height:36px;
        border:0;
        border-radius:50%;
        background:#292a30;
        color:white;
        font-size:24px;
        cursor:pointer;
    }
    .composer-actions{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
    }
    .div2 .div2-option{
        display:block;
        flex:1 1 120px;
        min-height:72px;
        padding:10px;
        border:1px solid #383a43;
        border-radius:12px;
        background:#22242b;

    }
    .div2 .div2-option svg{
        display:block;
        width:26px;
        height:26px;
        margin:0 auto 6px;
    }
    .div2 .div2-option span{
        display:block;
        text-align:center;
    }
    .composer-media-preview{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:10px 12px;
        border:1px solid #383a43;
        border-radius:10px;
        color:#e4e5eb;
        overflow-wrap:anywhere;
    }
    .composer-media-preview[hidden]{
        display:none;
    }
    .composer-media-preview button{
        flex:none;
        border:0;
        background:transparent;
        color:#9ab8ff;
        cursor:pointer;
    }
    .text-box{
        display:block;
        box-sizing: border-box;
        border:1px solid #383a43;
        background-color: #22242b;
        color:white;
        border-radius: 12px;
        min-height:140px;
        width:100%;
        padding:14px;
        font:inherit;
        resize:none;
    }
    .text-box::placeholder{
        color:#a1a3ad;
    }
    .btn2{
        align-self:flex-end;
        min-width:120px;
        min-height:44px;
        padding:0 20px;
        border:1px solid #343b70;
        background-color:navy;
        color:white;
        border-radius: 12px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        font:inherit;
        cursor:pointer;
    }
    .btn2:disabled{
        opacity:.55;
        cursor:not-allowed;
    }
    .post-spinner{
        width:16px;
        height:16px;
        border:2px solid rgba(255,255,255,0.3);
        border-top-color:white;
        border-radius:50%;
        animation:post-spin 0.8s linear infinite;
    }
    @keyframes post-spin{
        to{transform:rotate(360deg);}
    }
    .feed-refresh-indicator{
        position:fixed;
        top:64px;
        left:50%;
        z-index:12;
        display:flex;
        align-items:center;
        gap:9px;
        padding:9px 15px;
        border:1px solid #343640;
        border-radius:24px;
        background:#17181d;
        color:#f3f2e9;
        font-size:13px;
        box-shadow:0 6px 20px rgba(0,0,0,.35);
        transform:translate(-50%, -160%);
        opacity:0;
        pointer-events:none;
        transition:transform 160ms ease, opacity 160ms ease;
    }
    .feed-refresh-indicator[data-visible="true"]{
        transform:translate(-50%, 0);
        opacity:1;
    }
    .feed-refresh-spinner{
        display:none;
        width:15px;
        height:15px;
        border:2px solid rgba(255,255,255,.28);
        border-top-color:white;
        border-radius:50%;
    }
    .feed-refresh-indicator[data-state="refreshing"] .feed-refresh-spinner{
        display:block;
        animation:post-spin .75s linear infinite;
    }
    .feed-refresh-indicator[hidden]{
        display:none;
    }
    .div3{
        border:1px solid white;
        box-sizing:border-box;
        width:90%;
        margin:16px auto;
        padding:12px;
    }
    .post-author-header{
        display:flex;
        align-items:center;

    }
    .post-author-avatar{

    .post-author-image{
        display:block;

    .post-author-image[hidden]{
        display:none;
    }
    .post-author-initial{
        font-size:18px;
    }
    .post-author-initial[hidden]{
        display:none;
    }
    .post-author-name{
        min-width:0;

    .post-follow-button:hover{

    }

        cursor:pointer;
    }
    .post-delete-button svg{
        width:18px;

    }
    .post-delete-button:hover{
        border-color:#63343b;
        background:#351d22;
        color:#ff8585;
    }
    .post-delete-button:focus-visible{
        outline:2px solid #ff8585;
        outline-offset:2px;
    }
    .post-delete-button:disabled{
        cursor:wait;

    }
    .post-delete-button[hidden]{
        display:none;
    }
    .div3 .post-media{
        display:block;

    }
    .header22{
        text-align: center;
        color:white;
    }
    .header3{
        height: 22px;
        width:22px;
        cursor:pointer;
    }
    .post-like-button{
        display:grid;
        place-items:center;
        width:34px;
        height:34px;
        padding:0;
        border:0;
        border-radius:8px;
        background:transparent;
        color:white;
        cursor:pointer;
    }
    .post-like-button:hover{
        background:#2a2c33;
    }
    .post-like-button.is-liked{
        color:#ff4f68;
    }
    .post-like-button:focus-visible,

    }
    .post-like-button:disabled{

        opacity:.65;
    }
    .like-row{
        display:flex;
        align-items:center;
        gap:8px;
        color:white;
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-style: normal;
    }
    .post-comment-toggle{
        display:grid;
        grid-template-columns:20px auto;

        gap:5px;
        width:40px;

        padding:0;
